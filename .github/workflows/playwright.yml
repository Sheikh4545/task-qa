name: Playwright CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      CI: "true"
      BASE_URL: https://api-testing-postman.vercel.app
      HOTEL_URL: https://adactinhotelapp.com/Logout.php
      TEST_USER_USERNAME: ${{ secrets.TEST_USER_USERNAME || secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Verify test credentials
        run: |
          if [ -z "$TEST_USER_USERNAME" ] || [ -z "$TEST_USER_PASSWORD" ]; then
            echo "::error::Add TEST_USER_USERNAME (or TEST_USER_EMAIL) and TEST_USER_PASSWORD as repository Actions secrets."
            exit 1
          fi

      - name: Run Chromium tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            playwright-report/
            allure-results/
          if-no-files-found: warn
          retention-days: 30
